<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Extractor to ZIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #111;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            background: #fafafa;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0076ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status-container {
            margin-top: 20px;
            display: none;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .progress-bar-container {
            background-color: #e0e0e0;
            border-radius: 4px;
            height: 10px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }
        #progress-bar {
            background-color: #00c853;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        #status-text {
            font-size: 14px;
            font-weight: 500;
        }
        /* Hidden video/canvas elements used for processing */
        #hidden-video, #hidden-canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Video Frame Extractor</h1>
    <p style="font-size: 13px; color: #666; margin-top: -10px; margin-bottom: 20px;">
        Extract video frames into a downloadable ZIP entirely in your browser.
    </p>

    <div class="form-group">
        <label for="video-input">Select Video File</label>
        <input type="file" id="video-input" accept="video/*">
    </div>

    <div class="form-group" id="config-section">
        <label for="fps-input">Extraction Rate (Frames per second)</label>
        <input type="number" id="fps-input" value="10" min="0.1" max="60" step="0.1">
        <small style="color:#888; font-size:12px; display:block; margin-top:4px;">
            E.g., "1" extracts 1 frame per second. "30" extracts 30 frames per second.
        </small>
    </div>

    <button id="process-btn" disabled>Extract & Download ZIP</button>

    <div id="status-container">
        <div id="status-text">Ready to process...</div>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>
</div>

<video id="hidden-video" preload="auto"></video>
<canvas id="hidden-canvas"></canvas>

<script>
    const videoInput = document.getElementById('video-input');
    const fpsInput = document.getElementById('fps-input');
    const processBtn = document.getElementById('process-btn');
    const statusContainer = document.getElementById('status-container');
    const statusText = document.getElementById('status-text');
    const progressBar = document.getElementById('progress-bar');
    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d');

    let videoUrl = null;

    // Triggered when a video is uploaded
    videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Revoke old URL if existing to save memory
        if (videoUrl) URL.revokeObjectURL(videoUrl);

        videoUrl = URL.createObjectURL(file);
        video.src = videoUrl;
        
        statusContainer.style.display = 'block';
        statusText.innerText = "Loading video metadata...";
        processBtn.disabled = true;
    });

    // Once video metadata is loaded, we can fetch duration and dimensions
    video.addEventListener('loadedmetadata', () => {
        statusText.innerText = `Video loaded. Duration: ${video.duration.toFixed(2)}s (${video.videoWidth}x${video.videoHeight})`;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        processBtn.disabled = false;
    });

    processBtn.addEventListener('click', async () => {
        const fps = parseFloat(fpsInput.value);
        if (isNaN(fps) || fps <= 0) {
            alert("Please enter a valid frame rate greater than 0.");
            return;
        }

        // Setup UI
        processBtn.disabled = true;
        videoInput.disabled = true;
        fpsInput.disabled = true;

        const zip = new JSZip();
        const duration = video.duration;
        const interval = 1 / fps; // Time step between frames
        let currentTime = 0;
        let frameCount = 0;
        
        // Calculate estimated total frames to process
        const totalFrames = Math.ceil(duration / interval);

        try {
            while (currentTime < duration) {
                // Seek video to the targeted timestamp
                video.currentTime = currentTime;
                
                // Wait for the browser to finish rendering the frame at this timestamp
                await new Promise((resolve) => {
                    video.onseeked = resolve;
                });

                // Paint the current video frame onto the hidden canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert canvas paint into a JPEG Blob image data
                const blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.85); // 0.85 is JPEG quality
                });

                // Name the image chronologically and add to zip
                const filename = `frame_${String(frameCount).padStart(5, '0')}.jpg`;
                zip.file(filename, blob);

                frameCount++;
                currentTime += interval;

                // Update Progress UI
                const progressPercentage = Math.min((frameCount / totalFrames) * 100, 100);
                progressBar.style.width = `${progressPercentage}%`;
                statusText.innerText = `Extracting frames: ${frameCount} / ~${totalFrames}`;
            }

            // Generate the ZIP file
            statusText.innerText = "Packaging frames into ZIP... (This may take a moment)";
            progressBar.style.width = "100%";
            
            const zipBlob = await zip.generateAsync({ type: 'blob' });

            // Trigger Automatic Download
            statusText.innerText = "Downloading completed ZIP!";
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(zipBlob);
            downloadLink.download = `extracted_frames_${Date.now()}.zip`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

        } catch (error) {
            console.error(error);
            statusText.innerText = "An error occurred during extraction.";
        } finally {
            // Reset UI controls
            processBtn.disabled = false;
            videoInput.disabled = false;
            fpsInput.disabled = false;
        }
    });
</script>

</body>
</html>
